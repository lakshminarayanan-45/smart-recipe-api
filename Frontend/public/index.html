<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🍲 Smart Recipe Adjuster</title>
  <style>
    body { font-family: sans-serif; background: #fffaf0; padding: 2rem; text-align: center; }
    input, button { padding: 0.5rem; margin: 0.5rem; font-size: 1rem; }
    .response { margin-top: 1rem; padding: 1rem; border: 1px solid #ccc; background: #f9f9f9;
                max-width: 700px; margin-left: auto; margin-right: auto; text-align: left; }
    .section-title { margin-top: 1rem; font-weight: bold; }
    ul { padding-left: 1.5rem; }
  </style>
</head>
<body>
  <h1>🍲 Smart Recipe Adjuster</h1>
  <input id="recipeName" placeholder="Enter Recipe Name" />
  <input id="servings" type="number" min="1" placeholder="Number of Servings" />
  <button id="adjustBtn">Adjust Recipe</button>

  <div class="response" id="responseBox" style="display:none">
    <h3 id="recipeTitle"></h3>
    <p><strong>Cooking Time:</strong> <span id="timeInfo"></span></p>

    <div class="section-title">Adjusted Ingredients:</div>
    <div id="ingredients"></div>

    <div class="section-title">Preparation Steps:</div>
    <div id="steps"></div>

    <div class="section-title">Nutrition Information:</div>
    <div id="nutrition"></div>
  </div>

  <script>
    const API_KEY = "queenbee@987";
    const BASE_URL = "https://smart-recipe-api-ff12.onrender.com";
    const scaleUrl = `${BASE_URL}/scale_recipe`;
    const nutritionUrl = `${BASE_URL}/nutrition_info`;

    document.getElementById("adjustBtn").addEventListener("click", async () => {
      const recipe = document.getElementById("recipeName").value.trim();
      const servings = document.getElementById("servings").value.trim();
      if (!recipe || !servings) {
        alert("Please enter both recipe name and number of servings.");
        return;
      }

      try {
        // 1. Get scaled recipe
        const scaleRes = await fetch(scaleUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-KEY": API_KEY },
          body: JSON.stringify({ recipe_name: recipe, new_servings: parseInt(servings, 10) })
        });
        const scaleData = await scaleRes.json();
        if (!scaleRes.ok) throw new Error(scaleData.error || "Scaling failed");

        // 2. Get nutrition info
        const nutritionRes = await fetch(nutritionUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-KEY": API_KEY },
          body: JSON.stringify({ recipe_name: recipe })
        });
        const nutritionData = await nutritionRes.json();
        if (!nutritionRes.ok) throw new Error(nutritionData.error || "Nutrition fetch failed");

        // ===== Populate UI =====
        const responseBox = document.getElementById("responseBox");
        responseBox.style.display = "block";

        // Title and cooking time
        document.getElementById("recipeTitle").innerText = `${scaleData.recipe} (for ${scaleData.new_servings} servings)`;
        document.getElementById("timeInfo").innerText = `${scaleData.original_time} ➡ ${scaleData.adjusted_time}`;

        // Ingredients
        const ingredientsDiv = document.getElementById("ingredients");
        ingredientsDiv.innerHTML = scaleData.ingredients.map(i =>
          `- ${i.formattedAmount || ''} ${i.unit || ''} ${i.name}`
        ).join("<br>");

        // Steps
        const stepsDiv = document.getElementById("steps");
        stepsDiv.innerHTML = scaleData.steps.map((step, idx) =>
          `${idx+1}. ${step}`
        ).join("<br>");

        // Nutrition
        const nutritionDiv = document.getElementById("nutrition");
        nutritionDiv.innerHTML = "";

        // Total Nutrition
        if (nutritionData.total_nutrition && Object.keys(nutritionData.total_nutrition).length > 0) {
          nutritionDiv.innerHTML += "<strong>Total Nutrition:</strong><ul>";
          for (const [nutrient, value] of Object.entries(nutritionData.total_nutrition)) {
            nutritionDiv.innerHTML += `<li>${nutrient}: ${value}</li>`;
          }
          nutritionDiv.innerHTML += "</ul>";
        }

        // Per Ingredient Nutrition
        if (nutritionData.per_ingredient_nutrition && Object.keys(nutritionData.per_ingredient_nutrition).length > 0) {
          nutritionDiv.innerHTML += "<strong>Per Ingredient Nutrition:</strong>";
          for (const [ingredient, nutrients] of Object.entries(nutritionData.per_ingredient_nutrition)) {
            nutritionDiv.innerHTML += `<p><em>${ingredient}</em></p><ul>`;
            for (const [nutrient, value] of Object.entries(nutrients)) {
              nutritionDiv.innerHTML += `<li>${nutrient}: ${value}</li>`;
            }
            nutritionDiv.innerHTML += "</ul>";
          }
        }

        if ((!nutritionData.total_nutrition || Object.keys(nutritionData.total_nutrition).length === 0) &&
            (!nutritionData.per_ingredient_nutrition || Object.keys(nutritionData.per_ingredient_nutrition).length === 0)) {
          nutritionDiv.innerHTML = "<p>No nutrition information available.</p>";
        }

      } catch (err) {
        alert("❌ " + err.message);
        document.getElementById("responseBox").style.display = "none";
      }
    });
  </script>
</body>
</html>
